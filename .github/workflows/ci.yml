name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # A non-superuser owner, like Neon's neondb_owner, so row-level security applies as it does in production
      - name: Create the database owner
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "create role site_owner login password 'site_owner' createrole" \
            -c "create database site owner site_owner"
          psql -h localhost -U postgres -d site -v ON_ERROR_STOP=1 -c "alter schema public owner to site_owner"
      - run: scripts/db-test.sh
        env:
          DATABASE_URL: postgresql://site_owner:site_owner@localhost:5432/site
